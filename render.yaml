services:
  - type: web
    name: users-manager-backend
    runtime: ruby
    buildCommand: bundle install
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: users-db
          property: connectionString
  - type: worker
    name: users-manager-worker
    runtime: ruby
    buildCommand: bundle install
    startCommand: bundle exec rake solid_queue:start
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: users-db
          property: connectionString
  - type: pserv
    name: users-db
    runtime: postgres
    ipAllowList: []